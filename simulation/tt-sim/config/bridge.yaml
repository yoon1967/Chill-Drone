# ros_gz_bridge 설정: Gazebo 토픽 ↔ ROS 2 토픽
# 실제 TT 드라이버도 같은 ROS 토픽 이름을 쓰게 맞추면, 위쪽 코드는 시뮬레이션과 실기체를 구분하지 않아도 된다.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# 카메라 원본. 실제와 같은 지연을 준 영상은 latency_relay가 /tt/camera/image_delayed로 낸다.
- ros_topic_name: "/tt/camera/image_raw"
  gz_topic_name: "/tt/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# (평가 전용) 정답 깊이 영상. 비행 코드는 쓰지 않는다 (실기체에는 없는 센서)
- ros_topic_name: "/tt/camera/depth_gt"
  gz_topic_name: "/tt/camera/depth_gt"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/tt/camera/camera_info"
  gz_topic_name: "/tt/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# 전방 ToF: 가운데·위·아래 세 줄. 세 토픽의 ranges 전체 최솟값이 실제 센서의 측정값, 1.2 m를 넘으면 inf
- ros_topic_name: "/tt/tof_front"
  gz_topic_name: "/tt/tof_front"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
- ros_topic_name: "/tt/tof_front_up"
  gz_topic_name: "/tt/tof_front_up"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
- ros_topic_name: "/tt/tof_front_down"
  gz_topic_name: "/tt/tof_front_down"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/tt/tof_down"
  gz_topic_name: "/tt/tof_down"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/tt/imu"
  gz_topic_name: "/tt/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# 정답 위치. 평가·디버깅 전용이며 자율비행 코드의 입력으로 쓰면 안 된다.
- ros_topic_name: "/tt/odometry_gt"
  gz_topic_name: "/tt/odometry_gt"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# 속도 명령 (기체 기준: x 앞, y 왼쪽, z 위, angular.z 요 회전)
- ros_topic_name: "/tt/cmd_vel"
  gz_topic_name: "/tt/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
