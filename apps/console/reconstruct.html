<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영상 복원</title>
  <link rel="stylesheet" href="/reconstruct.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
  <script type="module" src="/reconstruct.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="title">
        <h1>영상 복원</h1>
        <p id="file-name" hidden></p>
      </div>
      <div class="actions">
        <button id="change" type="button" hidden>다른 영상</button>
        <button id="cancel" type="button" hidden>취소</button>
        <button id="retry" type="button" hidden>다시 시도</button>
        <a id="download" class="primary" download hidden>지도 저장</a>
      </div>
    </header>

    <div id="drop" class="drop" hidden>
      <button id="choose" class="primary" type="button">영상 선택</button>
      <input id="video" type="file" accept=".mp4,.mov,.avi,.mkv" hidden>
      <p>MP4 · MOV · AVI · MKV</p>
    </div>

    <section id="drone-recordings" aria-labelledby="drone-recordings-title" hidden>
      <h2 id="drone-recordings-title">드론 측정 및 센서 활용 복원</h2>
      <p id="drone-recordings-status" role="status"></p>
      <ul id="drone-recordings-list"></ul>
    </section>

    <div id="status-line" hidden>
      <strong id="status" role="status"></strong>
      <span id="notice" role="status" hidden></span>
      <span id="progress-value" hidden></span>
    </div>
    <progress id="progress" value="0" max="100" aria-label="영상 복원 진행" hidden></progress>

    <section id="model-picker" aria-labelledby="model-picker-title" hidden>
      <h2 id="model-picker-title">복원 모델 선택</h2>
      <p id="drone-pose-hint" hidden>녹화 시 기록된 드론 센서값으로 카메라의 위치와 방향을 계산합니다.</p>
      <div class="model-fields">
        <div id="pose-model-field" class="model-field">
          <label for="pose-model">카메라 위치 모델</label>
          <select id="pose-model" aria-describedby="pose-model-status" disabled></select>
          <div class="model-actions">
            <span id="pose-model-status" role="status"></span>
            <button id="pose-model-action" type="button" hidden></button>
          </div>
          <progress id="pose-model-progress" max="100" aria-label="카메라 위치 모델 준비 진행" hidden></progress>
        </div>
        <div class="model-field">
          <label for="depth-model">영상 깊이 모델</label>
          <select id="depth-model" aria-describedby="depth-model-status" disabled></select>
          <div class="model-actions">
            <span id="depth-model-status" role="status"></span>
            <button id="depth-model-action" type="button" hidden></button>
          </div>
          <progress id="depth-model-progress" max="100" aria-label="영상 깊이 모델 다운로드 진행" hidden></progress>
        </div>
      </div>
      <p class="model-hint">크기는 가중치 또는 특징점 사전 파일 기준입니다. GPU 메모리는 깊이 추론 권장량입니다.</p>
      <div class="model-actions">
        <span id="model-picker-error" role="status"></span>
        <button id="model-picker-retry" type="button" hidden>목록 다시 불러오기</button>
        <button id="start-reconstruction" class="primary" type="button" disabled>영상 복원하기</button>
      </div>
    </section>

    <section id="recent" aria-labelledby="recent-title" hidden>
      <h2 id="recent-title">최근 복원</h2>
      <p id="recent-empty" role="status"></p>
      <ul id="recent-list"></ul>
    </section>

    <section id="visual" class="visual" aria-label="복원 지도" hidden>
      <section id="current-frame" aria-labelledby="frame-label">
        <h2 id="frame-label">처리 중인 장면 <span id="progressive-frame-time"></span></h2>
        <div class="media">
          <img id="progressive-frame" alt="지도와 같은 시점의 영상 장면" hidden>
          <span id="progressive-video-empty">장면 대기 중</span>
        </div>
      </section>
      <section aria-labelledby="map-label">
        <h2 id="map-label">3D 지도</h2>
        <div id="progressive-viewport" class="media">
          <span id="progressive-map-empty">지도 생성 대기 중</span>
        </div>
        <p id="map-controls" hidden>드래그로 회전 · 스크롤로 확대</p>
      </section>
    </section>
  </main>
</body>
</html>
