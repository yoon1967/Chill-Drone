github-mirror:
  stage: mirror
  tags: [ec2-verify]
  image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
  resource_group: github-mirror
  interruptible: false
  allow_failure: true
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE =~ /^(push|web|schedule)$/'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE =~ /^(push|web)$/'
  environment:
    name: github-mirror
    action: access
  script:
    - apk add --no-cache git
    - python -B scripts/github_mirror.py
